name: Preview CI/CD

on:
  pull_request:
    branches:
      - develop

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_OAUTH_APP_KEY: ${{ secrets.NEXT_PUBLIC_OAUTH_APP_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm -r build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: .

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      pull-requests: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: .

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Preview)
        id: deploy-vercel
        run: |
          DEPLOY_URL=$(vercel deploy --token=${{ env.VERCEL_TOKEN }} --yes)
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY년 MM월 DD일 HH시 mm분'
          utcOffset: '+09:00'

      - name: Comment PR with preview URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: preview-link
          message: |
            🧷 **배포 미리보기:** ${{ steps.deploy-vercel.outputs.preview_url }}
            ⏰ **최종 업데이트:** ${{ steps.current-time.outputs.formattedTime }}
